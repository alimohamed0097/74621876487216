name: "austria_embassy_bot"
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: austria-embassy-monitor
  cancel-in-progress: false
jobs:
  check-appointments:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: '8939212306:AAH9zZh4fdJr6w3bJyhM1IYlMisMVKzisLQ'
          TELEGRAM_CHAT_ID: '8208425337'
          APPOINTMENT_URL: 'https://appointment.bmeia.gv.at/'
        run: |
          CURRENT_MIN=$((10#$(date +%M)))
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CURRENT_MIN" -lt 5 ]; then
            export SEND_HOURLY_STATUS="true"
          else
            export SEND_HOURLY_STATUS="false"
          fi
          python austria_embassy_bot.py
