name: Austria Embassy Appointment Monitor

on:
  schedule:
    # تشغيل الكود تلقائياً كل 5 دقائق على مدار الساعة (24/7)
    - cron: '*/5 * * * *'
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً في أي وقت من تبويب Actions

# منع تداخل أكثر من عملية فحص في نفس اللحظة
concurrency:
  group: austria-embassy-monitor
  cancel-in-progress: false

jobs:
  check-appointments:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Determine Hourly Status Flag & Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8939212306:AAH9zZh4fdJr6w3bJyhM1IYlMisMVKzisLQ' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8208425337' }}
          APPOINTMENT_URL: 'https://appointment.bmeia.gv.at/'
        run: |
          # استخدام 10# لتجنب خطأ الأرقام الثمانية (Octal) في Bash مثل الدقيقة 08 و 09
          CURRENT_MIN=$((10#$(date +%M)))
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CURRENT_MIN" -lt 5 ]; then
            export SEND_HOURLY_STATUS="true"
          else
            export SEND_HOURLY_STATUS="false"
          fi
          python austria_embassy_bot.py
